name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to OneLiteFeatherRepo
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: OneLiteFeatherNET/workflows/.github/workflows/gradle-publish.yml@v2.8.1
    with:
      java-version: "25"
      publish-task: "cyclonedxBom publish"
    secrets: inherit

  sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - name: Generate BOM
        run: ./gradlew cyclonedxBom --max-workers=2

      - uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-bom
          path: build/reports/cyclonedx/bom.xml
          if-no-files-found: error
          retention-days: 1

  bom:
    name: Upload SBOM to DependencyTrack
    needs: [release-please, sbom]
    if: needs.release-please.outputs.release_created == 'true'
    uses: OneLiteFeatherNET/workflows/.github/workflows/sbom-publish.yml@v2.8.1
    with:
      project-name: cloudnet-kubernetes
      project-version: ${{ needs.release-please.outputs.version }}
      artifact-name: cyclonedx-bom
      project-tags: cloudnet,kubernetes
      autocreate: true
    secrets: inherit
