# Credentials for the staging bucket the node uploads prepared service directories to.
# Create the bucket in Ceph first, e.g. through a CephObjectStoreUser.
#
# Note the key names differ by source: a CephObjectStoreUser secret carries AccessKey
# and SecretKey, while an ObjectBucketClaim produces AWS_ACCESS_KEY_ID and
# AWS_SECRET_ACCESS_KEY. This module reads its credentials from its own config.json.
apiVersion: v1
kind: Secret
metadata:
  name: cloudnet-staging-credentials
  namespace: cloudnet
type: Opaque
stringData:
  accessKey: "REPLACE_ME"
  secretKey: "REPLACE_ME"
